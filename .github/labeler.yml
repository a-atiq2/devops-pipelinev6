content:
  - changed-files:
      - any-glob-to-any-file:
          - '_posts/**'
          - 'index.md'

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - 'terraform/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'Gemfile'
          - 'Gemfile.lock'
